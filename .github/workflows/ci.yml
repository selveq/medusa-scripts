name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test · node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --version && bash --version | head -1
      - run: npm test

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      # bash 3.2 is what ships on macOS, and that is the floor we support
      - run: shellcheck --shell=bash --severity=warning assets/*.sh

  # Publish the tarball into a scratch project the way a user would, then bring
  # the real stack up on real images and tear it down again.
  install:
    name: fresh install + docker start
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pack the package
        run: echo "TARBALL=$(npm pack --silent)" >> "$GITHUB_ENV"

      - name: Install it into a scratch project
        run: |
          mkdir -p /tmp/scratch
          cd /tmp/scratch
          npm init -y >/dev/null
          npm i -D "$GITHUB_WORKSPACE/$TARBALL"

      - name: lma init
        working-directory: /tmp/scratch
        run: |
          npx lma init
          test -f lma.js
          state="$(node -p "require('@selveq/medusa-scripts/lib/paths.js').stateDir('.')")"
          echo "STATE=$state" >> "$GITHUB_ENV"
          test -f "$state/secrets.env"
          test "$(stat -c '%a' "$state/secrets.env")" = 600
          test "$(stat -c '%a' "$state")" = 700
          # state stays out of the project, where the admin's dev server would serve it
          test ! -e .local-medusa-app
          # the config must never ship a shared default password
          ! grep -q medusa123 lma.js

      - name: Dry runs start nothing
        working-directory: /tmp/scratch
        run: |
          npx lma start --dry-run
          npx lma destroy --dry-run
          npx lma reset-db --dry-run
          test -z "$(docker ps -aq)"
          test ! -e "$STATE/ports.json"

      - name: Start the stack for real
        working-directory: /tmp/scratch
        run: npx lma start

      - name: The pinned images are what got pulled
        working-directory: /tmp/scratch
        run: |
          node -e '
            const images = require("@selveq/medusa-scripts/lib/images.js")
            for (const s of ["postgres", "redis", "proxy"]) console.log(images.pinned(s))
          ' > /tmp/pinned.txt
          cat /tmp/pinned.txt
          # by tag and digest: an image pulled by digest carries no tag of its own
          while read -r ref; do
            docker image inspect "$ref" >/dev/null || { echo "missing $ref"; exit 1; }
          done < /tmp/pinned.txt

      - name: Everything answers, and only on loopback
        working-directory: /tmp/scratch
        run: |
          npx lma status
          npx lma psql -c 'select 1'
          docker ps --format '{{.Names}} {{.Ports}}' | tee /tmp/ports
          test "$(wc -l < /tmp/ports)" = 3
          ! grep -E '0\.0\.0\.0|:::' /tmp/ports

      - name: Dump and reset round-trip
        working-directory: /tmp/scratch
        run: |
          npx lma dump-db
          ls "$STATE"/dumps/*.sql.gz
          npx lma reset-db --yes

      - name: A destructive command refuses without a tty
        working-directory: /tmp/scratch
        run: |
          if npx lma destroy < /dev/null; then echo "destroy should have refused"; exit 1; fi
          docker volume ls | grep -q postgres-data

      - name: Tear it all down
        working-directory: /tmp/scratch
        if: always()
        run: npx lma destroy --yes

  # The whole of lma init with the real installer, npm and Medusa, in a path that breaks careless quoting.
  init:
    name: lma init with the real Medusa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Pack the package
        run: echo "TARBALL=$GITHUB_WORKSPACE/$(npm pack --silent)" >> "$GITHUB_ENV"

      - name: Install a store
        run: |
          mkdir -p "/tmp/my shop"
          cd "/tmp/my shop"
          LMA_TEST_SELF_SPEC="$TARBALL" npx --yes --package="$TARBALL" medusa-scripts init --backend api --store web --yes

      - name: It answers, and it does not hand out its secrets
        working-directory: /tmp/my shop
        run: |
          npx lma status
          # the config names no port: lma found one and pinned it
          port="$(npx lma ports --json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).ports.backend")"
          curl -fsS "http://localhost:$port/health"
          state="$(node -p "require('@selveq/medusa-scripts/lib/paths.js').stateDir('.')")"
          test -f "$state/secrets.env"
          test ! -e .local-medusa-app
          # the dev server serves files inside the project, and this one is outside it
          code="$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:$port/app/@fs$state/secrets.env")"
          test "$code" = 403

      - name: Tear it down
        working-directory: /tmp/my shop
        if: always()
        run: npx lma destroy --yes
